# Banco de Dados PostgreSQL
# Credenciais via variáveis de ambiente (DB_URL, DB_USERNAME, DB_PASSWORD) ou
# pelo arquivo local não versionado src/main/resources/application-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestao_leiteira}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.config.import=optional:classpath:application-local.properties

# Hibernate: a estrutura do banco é criada pelos scripts em database/ ;
# "validate" só confere se as entidades batem com as tabelas (nunca altera)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Porta do Servidor
server.port=8080

# Jackson: datas em ISO 8601 (yyyy-MM-ddTHH:mm:ss[.SSS])
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
